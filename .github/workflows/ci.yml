name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  QT_VERSION: 6.8.3
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .cache/vcpkg
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cmake -DSOURCE_DIR=. -DRELEASE_TAG="$GITHUB_REF_NAME" -P cmake/VerifyReleaseTag.cmake
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
      - name: Build and test
        shell: bash
        run: |
          cmake --build build/release
          ctest --test-dir build/release --output-on-failure
      - name: Test installed application
        shell: bash
        run: |
          cmake --install build/release --config Release --prefix "$GITHUB_WORKSPACE/build/release/stage"
          QT_QPA_PLATFORM=offscreen build/release/stage/bin/Hieda.exe --smoke-test
      - name: Package portable ZIP
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cpack --config build/release/CPackConfig.cmake -B build/release/package
          cmake -DARCHIVE=build/release/package/hieda-0.1.0-windows-x86_64.zip -DEXECUTABLE_NAME=Hieda.exe -P cmake/PackageSmoke.cmake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: windows-package
          path: build/release/package/hieda-0.1.0-windows-x86_64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .cache/vcpkg
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json') }}
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake -DSOURCE_DIR=. -DRELEASE_TAG="$GITHUB_REF_NAME" -P cmake/VerifyReleaseTag.cmake
      - name: Configure
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=arm64-osx
      - name: Build and test
        run: |
          cmake --build build/release
          ctest --test-dir build/release --output-on-failure
      - name: Test installed application
        run: |
          cmake --install build/release --config Release --prefix build/release/stage
          build/release/stage/Hieda.app/Contents/MacOS/Hieda --smoke-test
      - name: Package DMG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cpack --config build/release/CPackConfig.cmake -B build/release/package
          cmake -DDMG=build/release/package/hieda-0.1.0-macos-arm64.dmg -P cmake/MacPackageSmoke.cmake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: macos-package
          path: build/release/package/hieda-0.1.0-macos-arm64.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    container: registry.opensuse.org/opensuse/leap:15.6@sha256:a783ee8a37eef5e06dfd44c715ff5a228dfce4328415e5bc5651c9d99a95045d
    steps:
      - name: Install build tools
        run: >-
          zypper --non-interactive install --no-recommends
          Catch2-devel Mesa-libGL-devel cmake curl dbus-1-devel desktop-file-utils
          bison file flex fontconfig-devel freetype2-devel gcc13 gcc13-c++ git
          glib2-devel gperf
          libX11-devel libXext-devel libXi-devel libXrender-devel
          libglvnd-devel libicu-devel libinput-devel libjpeg8-devel lmdb-devel
          libopenssl-devel libpng16-devel libudev-devel libxcb-devel
          libxkbcommon-devel libxkbcommon-x11-devel ninja pcre2-devel
          perl pkg-config python311 tar util-linux which xcb-util-devel xcb-util-image-devel
          xcb-util-keysyms-devel xcb-util-renderutil-devel xcb-util-wm-devel
          xz zstd
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: qt-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .cache/qt-6.8.3
          key: qt-6.8.3-opensuse-leap-15.6-gcc13-v1
      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-qt-leap.sh "$GITHUB_WORKSPACE/.cache/qt-6.8.3"
      - name: Save Qt cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .cache/qt-6.8.3
          key: qt-6.8.3-opensuse-leap-15.6-gcc13-v1
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake -DSOURCE_DIR=. -DRELEASE_TAG="$GITHUB_REF_NAME" -P cmake/VerifyReleaseTag.cmake
      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.cache/qt-6.8.3"
      - name: Build, test, and validate metadata
        run: |
          cmake --build build/release
          ctest --test-dir build/release --output-on-failure
          setpriv --reuid=65534 --regid=65534 --clear-groups build/release/notebook_session_test "creating reports a permission-denied parent directory"
          desktop-file-validate assets/hieda.desktop
      - name: Test installed application
        run: |
          cmake --install build/release --prefix build/release/stage
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/.cache/qt-6.8.3/lib" QT_QPA_PLATFORM=offscreen build/release/stage/bin/hieda --smoke-test
      - name: Package AppImage
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cmake -DBUILD_DIR=build/release -DOUTPUT_DIR=build/release/package -DPROJECT_VERSION=0.1.0 -DSOURCE_DIR=. -DQMAKE="$GITHUB_WORKSPACE/.cache/qt-6.8.3/bin/qmake" -P cmake/BuildAppImage.cmake
          cmake -DAPPIMAGE=build/release/package/hieda-0.1.0-linux-x86_64.AppImage -P cmake/PackageSmoke.cmake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: linux-package
          path: build/release/package/hieda-0.1.0-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmake -DSOURCE_DIR=. -DRELEASE_TAG="$GITHUB_REF_NAME" -P cmake/VerifyReleaseTag.cmake
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
